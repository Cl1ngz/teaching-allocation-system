spring.application.name=teaching-allocation-system

# Optionally load local environment variables from backend/.env (ignored by git).
# Real OS / Docker environment variables always take precedence over values from this file.
spring.config.import=optional:file:.env[.properties]

# --- PostgreSQL connection (values come from environment variables) ---
# Variable names match compose.yaml, so the same configuration works locally and in Docker.
# The URL has a localhost default; username and password intentionally have no defaults:
# no credentials in source code.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tas_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.hikari.connection-timeout=5000

# --- Flyway ---
# Sample data (db/dev-data, "dev" profile only) is a repeatable migration. When a
# database that was started with "dev" is later used without it, that migration
# is "missing" locally; ignore it instead of failing validation (*:future is the
# Flyway default and stays).
spring.flyway.ignore-migration-patterns=*:future,repeatable:missing

# --- JPA / Hibernate ---
# The schema comes from Flyway migrations; Hibernate only checks on startup that
# the entities match it (SF-17).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Actuator ---
# /actuator/health reports the real database status (UP / DOWN).
management.endpoints.web.exposure.include=health
