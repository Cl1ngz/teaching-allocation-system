spring.application.name=teaching-allocation-system

# Optionally load local environment variables from backend/.env (ignored by git).
# Real OS / Docker environment variables always take precedence over values from this file.
spring.config.import=optional:file:.env[.properties]

# --- PostgreSQL connection (values come from environment variables) ---
# Variable names match compose.yaml, so the same configuration works locally and in Docker.
# The URL has a localhost default; username and password intentionally have no defaults:
# no credentials in source code.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tas_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# --- JPA / Hibernate ---
# Schema is not managed by Hibernate; tables and migrations are introduced in separate tasks.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# --- Actuator ---
# /actuator/health reports the real database status (UP / DOWN).
management.endpoints.web.exposure.include=health
